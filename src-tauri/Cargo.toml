[package]
name = "acervo"
version = "0.1.0"
description = "Acervo de B-roll: arraste vídeos, imagens e áudios direto pro editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
strip = true
