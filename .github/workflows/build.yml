name: Build

# Gera os instaladores do Windows (.exe e .msi) e do Mac (.dmg universal, Intel e Apple Silicon).
# Push na main: instaladores ficam em Actions > execução > Artifacts.
# Tag v*: instaladores vão também pra página de Releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Testes do Rust
        if: matrix.name == 'windows'
        working-directory: src-tauri
        run: cargo test

      - name: Compilar o app
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: acervo-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Acervo ${{ github.ref_name }}
          files: ${{ matrix.bundles }}
