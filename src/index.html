<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acervo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="#24262d"/>
        <rect x="9" y="7" width="15" height="9" rx="2" fill="#fff" fill-opacity=".12"/>
        <rect x="6" y="11" width="20" height="13" rx="2.5" fill="#ff6a3d"/>
        <path d="M14 14.5v6.4c0 .6.6.9 1.1.6l4.8-3.1c.5-.3.5-.9 0-1.2l-4.8-3.3c-.5-.3-1.1 0-1.1.6z" fill="#fff"/>
      </svg>
      <div>
        <strong>Acervo</strong>
        <span>B-roll do editor</span>
      </div>
    </div>

    <nav class="shortcuts">
      <button class="nav-item" data-view="favorites">
        <svg class="ic"><use href="#i-star"/></svg><span>Favoritos</span><em id="count-fav"></em>
      </button>
      <button class="nav-item" data-view="used">
        <svg class="ic"><use href="#i-history"/></svg><span>Usados recentemente</span>
      </button>
      <button class="nav-item" data-view="recent">
        <svg class="ic"><use href="#i-clock"/></svg><span>Adicionados recentemente</span>
      </button>
    </nav>

    <div class="side-head" data-drop-root>
      <span>Bibliotecas</span>
      <button class="icon-btn" id="btn-add-root" title="Adicionar pasta à biblioteca">
        <svg class="ic"><use href="#i-plus"/></svg>
      </button>
    </div>
    <div class="tree" id="tree"></div>

    <div class="side-foot">
      Arraste os cards direto pro CapCut, Premiere ou DaVinci.
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Buscar em todas as bibliotecas" spellcheck="false" autocomplete="off">
        <button class="scope" id="scope" title="Onde buscar">Tudo</button>
        <kbd id="search-kbd">Ctrl F</kbd>
      </div>
    </header>

    <div class="toolbar">
      <div class="seg" id="filter">
        <button data-f="all" class="on">Tudo <em></em></button>
        <button data-f="video">Vídeos <em></em></button>
        <button data-f="image">Imagens <em></em></button>
        <button data-f="audio">Áudios <em></em></button>
      </div>
      <div class="seg seg-icons" id="orient" title="Formato">
        <button data-o="all" class="on" title="Todos os formatos">Todos</button>
        <button data-o="h" title="Só horizontais (16:9)"><svg class="ic"><use href="#i-landscape"/></svg></button>
        <button data-o="v" title="Só verticais (9:16)"><svg class="ic"><use href="#i-portrait"/></svg></button>
      </div>
      <div class="grow"></div>
      <label class="select">
        <svg class="ic"><use href="#i-sort"/></svg>
        <select id="sort">
          <option value="name">Nome</option>
          <option value="new">Mais recentes</option>
          <option value="old">Mais antigos</option>
          <option value="size">Tamanho</option>
          <option value="dur">Duração</option>
        </select>
      </label>
      <label class="size-range" title="Tamanho das miniaturas">
        <svg class="ic"><use href="#i-grid"/></svg>
        <input type="range" id="size" min="140" max="360" step="10" value="210">
      </label>
      <button class="btn" id="btn-new-folder"><svg class="ic"><use href="#i-folder-plus"/></svg>Nova pasta</button>
      <button class="btn btn-accent" id="btn-import"><svg class="ic"><use href="#i-import"/></svg>Importar</button>
    </div>

    <section class="content" id="content" tabindex="0">
      <div id="folders" class="folders"></div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden"></div>
    </section>

    <footer class="statusbar">
      <span id="st-count"></span>
      <span id="st-sel"></span>
      <span class="grow"></span>
      <span id="st-tip">Espaço: prévia · Duplo clique: abrir · Botão direito: mais opções</span>
    </footer>

    <div class="drop-overlay hidden" id="drop-overlay">
      <div class="drop-card">
        <svg class="ic"><use href="#i-import"/></svg>
        <strong id="drop-title">Solte pra copiar</strong>
        <span id="drop-sub"></span>
      </div>
    </div>
  </main>

  <!-- prévia grande -->
  <div class="preview hidden" id="preview">
    <div class="pv-top">
      <div class="pv-title">
        <strong id="pv-name"></strong>
        <span id="pv-meta"></span>
      </div>
      <button class="btn pv-drag" id="pv-drag" title="Segure e arraste pro editor">
        <svg class="ic"><use href="#i-drag"/></svg>Arrastar pro editor
      </button>
      <button class="icon-btn" id="pv-fav" title="Favoritar"><svg class="ic"><use href="#i-star"/></svg></button>
      <button class="icon-btn" id="pv-reveal" title="Mostrar na pasta"><svg class="ic"><use href="#i-folder-open"/></svg></button>
      <button class="icon-btn" id="pv-close" title="Fechar (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="pv-stage" id="pv-stage"></div>
    <button class="pv-nav prev" id="pv-prev" title="Anterior (←)"><svg class="ic"><use href="#i-left"/></svg></button>
    <button class="pv-nav next" id="pv-next" title="Próximo (→)"><svg class="ic"><use href="#i-right"/></svg></button>
  </div>

  <div class="menu hidden" id="menu"></div>

  <div class="dialog-wrap hidden" id="dialog">
    <form class="dialog" id="dialog-form">
      <strong id="dlg-title"></strong>
      <p id="dlg-msg"></p>
      <input id="dlg-input" spellcheck="false" autocomplete="off">
      <div class="dlg-actions">
        <button type="button" class="btn" id="dlg-cancel">Cancelar</button>
        <button type="submit" class="btn btn-accent" id="dlg-ok">OK</button>
      </div>
    </form>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- ícones -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4h4M12 7.5V12l3 2"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5L7 20l3.5-3.5M13 6h8M13 11h6M13 16h4"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3.5 17.5V7.5a2 2 0 0 1 2-2h3.8l2 2.2h6.2a2 2 0 0 1 2 2v1.3M3.5 17.5l2.4-6a1.6 1.6 0 0 1 1.5-1h12.4a1 1 0 0 1 .9 1.4l-2.2 5.6a1.6 1.6 0 0 1-1.5 1H5.2a1.6 1.6 0 0 1-1.7-1z"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4.5 15.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/></symbol>
      <symbol id="i-landscape" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2"/></symbol>
      <symbol id="i-portrait" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 6.5L15 12l-5.5 5.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
      <symbol id="i-drag" viewBox="0 0 24 24"><path d="M9 5.5h.01M15 5.5h.01M9 12h.01M15 12h.01M9 18.5h.01M15 18.5h.01" stroke-width="3.2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.8v12.4c0 .8.9 1.3 1.6.8l9.4-6.2c.6-.4.6-1.2 0-1.6L9.6 5C8.9 4.5 8 5 8 5.8z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.4"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 15.5l-5-5-9.5 9"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 5.5h4v13H4zM10 5.5h4v13h-4zM16.2 6.2l3.8-1 3 12.6-3.8 1z" transform="translate(-1 0)"/></symbol>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>
